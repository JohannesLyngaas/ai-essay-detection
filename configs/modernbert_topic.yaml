# Fine-tuned ModernBERT-base on the topic split. Needs a GPU (run on Kaggle).
# Run: python -m essaydetect.train --config configs/modernbert_topic.yaml

name: modernbert_topic
type: transformer
model_name: answerdotai/ModernBERT-base
split: topic
seed: 42

max_length: 1024
learning_rate: 2.0e-5
epochs: 3
batch_size: 8
gradient_accumulation_steps: 2
weight_decay: 0.01
warmup_ratio: 0.1
fp16: true

subsample: null
